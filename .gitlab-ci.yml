# CI SmartRoute (monorepo) : tests du backend et vérifications du front.
# Chaque job ne tourne que si son dossier (ou ce fichier) a changé.

stages:
  - test

# Pipelines de branche et de merge request, sans doublon quand une MR est ouverte.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

backend:test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  # MongoDB réel pour les tests d'intégration (Integration/), joignable sous le nom d'hôte « mongo ».
  services:
    - name: mongo:8
      alias: mongo
  variables:
    DOTNET_NOLOGO: "1"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
    # Les tests d'intégration utilisent la base smartroute_test sur ce MongoDB ;
    # MongoDB obligatoire en CI : un test d'intégration échoue (au lieu d'être ignoré) s'il est injoignable.
    SMARTROUTE_TEST_MONGO: mongodb://mongo:27017
    SMARTROUTE_REQUIRE_MONGO: "true"
  cache:
    key:
      files:
        - backend/SmartRoute.Api/SmartRoute.Api.csproj
        - backend/SmartRoute.Tests/SmartRoute.Tests.csproj
    paths:
      - .nuget/packages
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  script:
    - cd backend
    # Pas de user-secrets : clé JWT de test ; tests d'API sur repository en mémoire, Integration/ sur MongoDB.
    # Code de sortie non nul si un test échoue → le job échoue.
    - dotnet test --report-xunit-junit --report-xunit-junit-filename junit.xml --results-directory TestResults
  artifacts:
    when: always
    reports:
      junit: backend/TestResults/junit.xml
    expire_in: 1 week

frontend:check:
  stage: test
  image: node:22
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npx tsc --noEmit
    - npx expo-doctor
