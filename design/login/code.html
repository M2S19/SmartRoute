<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-background":"#131b2e","surface-dim":"#d2d9f4","on-surface":"#131b2e","inverse-on-surface":"#eef0ff","tertiary-fixed":"#ffdbcd","on-secondary-fixed":"#0d1c2e","on-secondary-fixed-variant":"#3a485b","secondary-fixed-dim":"#b9c7df","error":"#ba1a1a","tertiary-fixed-dim":"#ffb596","on-secondary-container":"#57657a","on-tertiary-container":"#ffc0a7","primary-fixed-dim":"#b0c6ff","outline":"#737784","surface-container-high":"#e2e7ff","surface-container-lowest":"#ffffff","inverse-surface":"#283044","outline-variant":"#c3c6d5","on-surface-variant":"#434653","on-primary":"#ffffff","secondary":"#515f74","primary-container":"#0f52ba","on-tertiary-fixed-variant":"#7d2d00","surface-tint":"#1d59c1","on-tertiary":"#ffffff","on-primary-container":"#bcceff","surface-bright":"#faf8ff","tertiary-container":"#993900","surface-container-highest":"#dae2fd","surface-variant":"#dae2fd","secondary-fixed":"#d5e3fc","on-primary-fixed":"#001945","on-secondary":"#ffffff","error-container":"#ffdad6","on-error":"#ffffff","secondary-container":"#d5e3fc","tertiary":"#732900","on-primary-fixed-variant":"#00419c","surface-container-low":"#f2f3ff","on-error-container":"#93000a","primary":"#003c90","surface-container":"#eaedff","on-tertiary-fixed":"#360f00","surface":"#faf8ff","primary-fixed":"#d9e2ff","inverse-primary":"#b0c6ff","background":"#faf8ff"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{"space-md":"0.75rem","space-sm":"0.5rem",gutter:"1rem","space-lg":"1.25rem","space-xs":"0.25rem","space-xl":"2rem",margin:"1.5rem"},fontFamily:{"label-lg":["Space Grotesk"],"label-md":["Space Grotesk"],"headline-lg":["Space Grotesk"],"headline-lg-mobile":["Space Grotesk"],"label-sm":["Space Grotesk"],"body-lg":["IBM Plex Sans"],"body-md":["IBM Plex Sans"],"headline-sm":["Space Grotesk"],display:["Space Grotesk"],"headline-md":["Space Grotesk"],"body-sm":["IBM Plex Sans"]},fontSize:{"label-lg":["13px",{lineHeight:"16px",letterSpacing:"0.04em",fontWeight:"600"}],"label-md":["11px",{lineHeight:"14px",letterSpacing:"0.06em",fontWeight:"500"}],"headline-lg":["32px",{lineHeight:"36px",letterSpacing:"-0.02em",fontWeight:"600"}],"headline-lg-mobile":["24px",{lineHeight:"28px",letterSpacing:"-0.02em",fontWeight:"600"}],"label-sm":["10px",{lineHeight:"12px",letterSpacing:"0.08em",fontWeight:"600"}],"body-lg":["16px",{lineHeight:"24px",fontWeight:"400"}],"body-md":["14px",{lineHeight:"20px",fontWeight:"400"}],"headline-sm":["16px",{lineHeight:"20px",letterSpacing:"0em",fontWeight:"600"}],display:["48px",{lineHeight:"52px",letterSpacing:"-0.03em",fontWeight:"700"}],"headline-md":["20px",{lineHeight:"24px",letterSpacing:"-0.01em",fontWeight:"600"}],"body-sm":["12px",{lineHeight:"16px",fontWeight:"400"}]}}}};</script><style>
    body {
      min-height: max(884px, 100dvh);

  </head><body class="bg-surface font-body-md text-body-md text-on-surface pt-safe pb-safe flex flex-col min-h-screen"><main class="flex-1 flex flex-col w-full px-gutter bg-surface"><div class="flex flex-col w-full pb-safe">
<div class="w-full max-w-sm mx-auto py-space-xl flex flex-col justify-center min-h-[707px]">
<!-- Marque / Identité sobre -->
<div class="mb-space-xl text-center">
<div class="inline-flex items-center justify-center w-12 h-12 bg-surface-container-high text-primary mb-space-sm">
<span class="material-symbols-outlined text-2xl">alt_route</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">SmartRoute</h1>
</div>
<!-- Carte de formulaire épurée -->
<div class="bg-surface-container-lowest p-margin shadow-sm flex flex-col">
<div class="mb-space-lg">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Connexion</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs">Veuillez vous identifier pour accéder à votre espace.</p>
</div>
<form class="flex flex-col gap-space-lg" id="loginForm" onsubmit="handleLogin(event)">
<!-- Champ Email -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface uppercase" for="email">Email</label>
<div class="relative flex items-center bg-surface-container-low">
<input class="w-full bg-transparent px-space-md py-space-md font-body-md text-body-md text-on-surface placeholder:text-outline outline-none" id="email" placeholder="nom@exemple.fr" required="" type="email"/>
</div>
</div>
<!-- Champ Mot de passe -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface uppercase" for="password">Mot de passe</label>
<div class="relative flex items-center bg-surface-container-low">
<input class="w-full bg-transparent pl-space-md pr-12 py-space-md font-body-md text-body-md text-on-surface placeholder:text-outline outline-none" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Afficher ou masquer le mot de passe" class="absolute right-0 top-0 bottom-0 px-space-md flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-xl" id="pwdIcon">visibility</span>
</button>
</div>
</div>
<!-- Message d'information de routage discret lors de la soumission -->
<div class="hidden p-space-sm bg-surface-container text-on-surface-variant font-body-sm text-body-sm" id="routingMessage"></div>
<!-- Bouton d'action -->
<button class="w-full mt-space-sm py-space-md px-space-lg bg-primary text-on-primary font-label-lg text-label-lg uppercase transition-colors flex items-center justify-center gap-space-sm active:bg-primary-container" id="submitBtn" type="submit">
<span>Se connecter</span>
</button>
</form>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    var passwordInput = document.getElementById('password');
    var icon = document.getElementById('pwdIcon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleLogin(event) {
    event.preventDefault();
    var emailInput = document.getElementById('email').value.trim().toLowerCase();
    var routingMsg = document.getElementById('routingMessage');
    var submitBtn = document.getElementById('submitBtn');

    submitBtn.disabled = true;
    submitBtn.classList.add('opacity-75');

    // Détermination sobre du rôle cible pour la démonstration backend
    var targetRole = "Livreur";
    if (emailInput.includes('logistique') || emailInput.includes('resp') || emailInput.includes('admin') || emailInput.includes('gestion')) {
      targetRole = "Responsable logistique";
    }

    routingMsg.textContent = "Authentification validée. Redirection vers l'espace : " + targetRole + "...";
    routingMsg.classList.remove('hidden');

    setTimeout(function() {
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-75');
    }, 1500);
  }
</script></main></body></html>
