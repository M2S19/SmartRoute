services:

  mongodb:
    image: ${MONGO_IMAGE}

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE}

    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_INTERNAL_PORT: ${API_INTERNAL_PORT}
    environment:
      ASPNETCORE_URLS: http://+:${API_INTERNAL_PORT}
      MongoDb__ConnectionString: mongodb://mongodb:${MONGO_INTERNAL_PORT}

    depends_on:
      mongodb:
        condition: service_healthy