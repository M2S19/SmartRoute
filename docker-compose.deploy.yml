name: smartroute-prod

services:
  mongo:
    image: mongo:9.0.4
    restart: unless-stopped

    volumes:
      - mongo-prod:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: "smartroute-api:${APP_VERSION:?APP_VERSION_required}"

    restart: unless-stopped

    env_file:
      - .env.production

    ports:
      - "8082:8080"

    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-prod: